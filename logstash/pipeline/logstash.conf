# Recibe los logs de los backends del componente central (WildFly) y los envia a Elasticsearch.
#
#   WildFly (socket-handler + json-formatter) --TCP/JSON--> Logstash --> Elasticsearch
#
# Cada linea JSON que llega es un registro de log en el formato de json-formatter de WildFly
# (timestamp, level, loggerName, message, threadName, hostName, stackTrace, mdc...).

input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Fecha del evento (la que genero WildFly), no la de llegada a Logstash.
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # Campos propios del input TCP / de WildFly que no aportan (se hace antes del rename para no
  # llevarse host.name).
  mutate { remove_field => ["sequence", "loggerClassName", "threadId", "host", "port"] }

  # Nombres de campo ECS, para que Kibana (Logs / Discover) los reconozca.
  mutate { lowercase => ["level"] }
  mutate {
    rename => {
      "level"       => "[log][level]"
      "loggerName"  => "[log][logger]"
      "threadName"  => "[process][thread][name]"
      "processName" => "[process][name]"
      "processId"   => "[process][pid]"
      "hostName"    => "[host][name]"
      "stackTrace"  => "[error][stack_trace]"
    }
  }

  # Servicio = proyecto de origen. Los proyectos usan el groupId base tse.lab.<proyecto>
  # (ej. tse.lab.frontofficeciudadanos.service.X) -> service.name = frontofficeciudadanos.
  # Todo lo que no sea codigo propio (org.jboss..., org.hibernate...) cae en "wildfly".
  grok {
    match => { "[log][logger]" => "^tse\.lab\.(?<[service][name]>[A-Za-z0-9]+)" }
    tag_on_failure => []
  }
  if ![service][name] {
    mutate { add_field => { "[service][name]" => "wildfly" } }
  }
  mutate { lowercase => ["[service][name]"] }

  # Un data stream por servicio: logs-<servicio>-default
  mutate {
    add_field => {
      "[data_stream][type]"      => "logs"
      "[data_stream][dataset]"   => "%{[service][name]}"
      "[data_stream][namespace]" => "default"
    }
  }
}

output {
  elasticsearch {
    hosts       => ["http://elasticsearch:9200"]
    user        => "${ES_USER}"
    password    => "${ES_PASSWORD}"
    data_stream => true   # enruta por [data_stream][type|dataset|namespace]
  }
}
