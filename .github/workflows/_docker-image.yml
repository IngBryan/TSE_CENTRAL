name: Imagen Docker

# Plantilla reutilizable: no corre sola, la llaman frontend-*.yml y docker-wildfly.yml.
# Construye la imagen de un servicio de docker-compose.yml y, en main, la publica en
# GitHub Container Registry (ghcr.io): queda en la seccion Packages del repo.
on:
  workflow_call:
    inputs:
      service:
        description: Servicio de docker-compose.yml a construir y publicar
        type: string
        required: true
      build-args:
        description: Build args de la imagen publicada (uno por linea, NOMBRE=valor); pisan los de docker-compose.yml, que son los de desarrollo local
        type: string
        required: false
        default: ""

jobs:
  docker:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        env:
          SERVICE: ${{ inputs.service }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          args=()
          while IFS= read -r arg; do
            [ -n "$arg" ] && args+=(--build-arg "$arg")
          done <<< "$BUILD_ARGS"
          docker compose build "${args[@]}" "$SERVICE"

      # Si se corre a mano desde otra rama, la imagen se construye pero no se publica.
      - name: Login en GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dos tags: latest (la ultima de main) y sha-<commit> (para poder volver a una version
      # anterior). Docker no acepta mayusculas, por eso el nombre del repo va en minusculas.
      - name: Publicar imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          LOCAL="$(docker compose config --format json | jq -r .name)-${SERVICE}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}"
          for TAG in latest "sha-${GITHUB_SHA::7}"; do
            docker tag "$LOCAL" "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
          echo "Imagen publicada: \`$IMAGE\` (tags \`latest\` y \`sha-${GITHUB_SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"
