name: Backend - Fiscalizacion automatica

# Solo corre cuando se pushea a main un cambio en este proyecto (o a mano desde Actions).
on:
  push:
    branches:
      - main
      - dev
    paths:
      - componente_central/backend/Fiscalizacionautomatica/**
      # El contrato del EJB remoto (ejb-client de Frontofficeciudadanos) y Modelo, del que depende
      - componente_central/backend/Modelo/**
      - componente_central/backend/Frontofficeciudadanos/pom.xml
      - componente_central/backend/Frontofficeciudadanos/ejb/**
      - .github/workflows/backend-fiscalizacionautomatica.yml
      - .github/workflows/_build-backend.yml
  pull_request:
    branches:
      - dev
    paths:
      - componente_central/backend/Fiscalizacionautomatica/**
      # El contrato del EJB remoto (ejb-client de Frontofficeciudadanos) y Modelo, del que depende
      - componente_central/backend/Modelo/**
      - componente_central/backend/Frontofficeciudadanos/pom.xml
      - componente_central/backend/Frontofficeciudadanos/ejb/**
      - .github/workflows/backend-fiscalizacionautomatica.yml
      - .github/workflows/_build-backend.yml
  workflow_dispatch:

jobs:
  backend:
    uses: ./.github/workflows/_build-backend.yml
    with:
      path: componente_central/backend/Fiscalizacionautomatica
      artifact-name: backend-fiscalizacionautomatica
      artifact: target/*.jar
      sonar-project-key: tse-central-backend-fiscalizacionautomatica
      install-first: componente_central/backend/Modelo componente_central/backend/Frontofficeciudadanos

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
