name: Build backend

# Plantilla reutilizable: no corre sola, la llaman los workflows backend-*.yml (uno por
# proyecto), que son los que deciden cuando correr segun la carpeta que cambio.
on:
  workflow_call:
    inputs:
      path:
        description: Carpeta del proyecto Maven
        type: string
        required: true
      artifact-name:
        description: Nombre del artifact que se guarda
        type: string
        required: true
      artifact:
        description: Archivo a guardar, relativo a la carpeta del proyecto
        type: string
        required: true
      install-first:
        description: Proyecto Maven del que depende y que se instala antes (por ejemplo un api de EJB remoto)
        type: string
        required: false
        default: ""

jobs:
  build:
    name: Compilar, testear y guardar build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven

      - name: Instalar proyecto del que depende
        if: inputs.install-first != ''
        run: mvn -B -f "${{ inputs.install-first }}/pom.xml" install -DskipTests

      - name: Compilar y ejecutar tests
        run: mvn -B -f "${{ inputs.path }}/pom.xml" clean verify

      # El .ear (o el .jar de Fiscalizacion) queda descargable en la pagina de la corrida.
      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.path }}/${{ inputs.artifact }}
          if-no-files-found: error
          retention-days: 14
