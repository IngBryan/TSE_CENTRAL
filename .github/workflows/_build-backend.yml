name: Build backend

# Plantilla reutilizable: no corre sola, la llaman los workflows backend-*.yml (uno por
# proyecto), que son los que deciden cuando correr segun la carpeta que cambio.
on:
  workflow_call:
    inputs:
      path:
        description: Carpeta del proyecto Maven
        type: string
        required: true
      artifact-name:
        description: Nombre del artifact que se guarda
        type: string
        required: true
      artifact:
        description: Archivo a guardar, relativo a la carpeta del proyecto
        type: string
        required: true
      sonar-project-key:
        description: Project Key de SonarQube Cloud
        type: string
        required: true
      install-first:
        description: Proyectos Maven de los que depende, separados por espacio y en orden (por ejemplo Modelo)
        type: string
        required: false
        default: ""

    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  build:
    name: Compilar, testear y guardar build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven

      - name: Instalar proyectos de los que depende
        if: inputs.install-first != ''
        run: |
          for project in ${{ inputs.install-first }}; do
            mvn -B -f "$project/pom.xml" install -DskipTests
          done

      - name: Compilar y ejecutar tests
        run: >
          mvn -B
          -f "${{ inputs.path }}/pom.xml"
          clean verify

      # El .ear (o el .jar de Fiscalizacion) queda descargable en la pagina de la corrida.
      # Not on pull requests: only builds of main are kept (artifact storage quota).
      - name: Guardar build
        if: github.event_name != 'pull_request'
        # The artifact is not used to build the image: a full storage quota must not block it
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.path }}/${{ inputs.artifact }}
          if-no-files-found: error
          retention-days: 1
      
      # SonarCloud solo en dev y sin bloquear el build.
      - name: Analisis estatico SonarQube
        if: github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.base_ref == 'dev')
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          -f "${{ inputs.path }}/pom.xml"
          verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -DskipTests
          -Dsonar.projectKey="${{ inputs.sonar-project-key }}"
          -Dsonar.organization="${{ vars.SONAR_ORGANIZATION }}"
