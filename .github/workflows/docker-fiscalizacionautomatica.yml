name: Docker - Fiscalizacion automatica

on:
  push:
    branches:
      - main
    paths:
      - componente_central/backend/Fiscalizacionautomatica/**
      - componente_central/backend/Modelo/**
      - componente_central/backend/Frontofficeciudadanos/pom.xml
      - componente_central/backend/Frontofficeciudadanos/ejb/**
      - componente_central/backend/Backofficeautoridadesadministradores/pom.xml
      - componente_central/backend/Backofficeautoridadesadministradores/ejb/**
      - docker-compose.yml
      - .github/workflows/docker-fiscalizacionautomatica.yml
      - .github/workflows/_docker-image.yml
  workflow_dispatch:

jobs:
  docker:
    uses: ./.github/workflows/_docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      service: fiscalizacionautomatica
