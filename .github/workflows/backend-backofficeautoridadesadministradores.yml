name: Backend - Backoffice autoridades administradores

# Solo corre cuando se pushea a main un cambio en este proyecto (o a mano desde Actions).
on:
  push:
    branches:
      - main
    paths:
      - componente_central/backend/Backofficeautoridadesadministradores/**
      - componente_central/backend/Modelo/**
      - .github/workflows/backend-backofficeautoridadesadministradores.yml
      - .github/workflows/_build-backend.yml
  workflow_dispatch:

jobs:
  backend:
    uses: ./.github/workflows/_build-backend.yml
    with:
      path: componente_central/backend/Backofficeautoridadesadministradores
      artifact-name: backend-backofficeautoridadesadministradores
      artifact: ear/target/*.ear
      install-first: componente_central/backend/Modelo
