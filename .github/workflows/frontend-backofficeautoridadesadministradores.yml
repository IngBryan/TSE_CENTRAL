name: Frontend - Backoffice autoridades administradores

# Solo corre cuando se pushea a main un cambio en este proyecto (o a mano desde Actions).
on:
  push:
    branches:
      - main
      - dev
    paths:
      - componente_central/frontend/backofficeautoridadesadministradores/**
      - .github/workflows/frontend-backofficeautoridadesadministradores.yml
      - .github/workflows/_build-frontend.yml
      - .github/workflows/_docker-image.yml
  pull_request:
    branches:
      - dev
    paths:
      - componente_central/frontend/backofficeautoridadesadministradores/**
      - .github/workflows/frontend-backofficeautoridadesadministradores.yml
      - .github/workflows/_build-frontend.yml
      - .github/workflows/_docker-image.yml
  workflow_dispatch:

jobs:
  frontend:
    uses: ./.github/workflows/_build-frontend.yml
    with:
      path: componente_central/frontend/backofficeautoridadesadministradores
      artifact-name: frontend-backofficeautoridadesadministradores
      sonar-project-key: tse-central-frontend-backofficeautoridadesadm

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    needs: frontend
    uses: ./.github/workflows/_docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      service: backofficeautoridadesadministradores-front
