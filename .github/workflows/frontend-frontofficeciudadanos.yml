name: Frontend - Frontoffice ciudadanos

# Solo corre cuando se pushea a main un cambio en este proyecto (o a mano desde Actions).
on:
  push:
    branches:
      - main
    paths:
      - componente_central/frontend/frontofficeciudadanos/**
      - .github/workflows/frontend-frontofficeciudadanos.yml
      - .github/workflows/_build-frontend.yml
      - .github/workflows/_docker-image.yml
  workflow_dispatch:

jobs:
  frontend:
    uses: ./.github/workflows/_build-frontend.yml
    with:
      path: componente_central/frontend/frontofficeciudadanos
      artifact-name: frontend-frontofficeciudadanos

  docker:
    needs: frontend
    uses: ./.github/workflows/_docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      service: frontofficeciudadanos-front
