name: Frontend - Frontoffice funcionarios

# Solo corre cuando se pushea a main un cambio en este proyecto (o a mano desde Actions).
on:
  push:
    branches:
      - main
    paths:
      - componente_central/frontend/Frontofficefuncionarios/**
      - .github/workflows/frontend-frontofficefuncionarios.yml
      - .github/workflows/_build-frontend.yml
  workflow_dispatch:

jobs:
  frontend:
    uses: ./.github/workflows/_build-frontend.yml
    with:
      path: componente_central/frontend/Frontofficefuncionarios
      artifact-name: frontend-frontofficefuncionarios
      docker-service: frontofficefuncionarios-front
