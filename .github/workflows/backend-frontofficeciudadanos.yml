name: Backend - Frontoffice ciudadanos

# Solo corre cuando se pushea a main un cambio en este proyecto (o a mano desde Actions).
on:
  push:
    branches:
      - main
    paths:
      - componente_central/backend/Frontofficeciudadanos/**
      # Usa el api de EJB remoto de Frontofficefuncionarios
      - componente_central/backend/Frontofficefuncionarios/api/**
      - .github/workflows/backend-frontofficeciudadanos.yml
      - .github/workflows/_build-backend.yml
  workflow_dispatch:

jobs:
  backend:
    uses: ./.github/workflows/_build-backend.yml
    with:
      path: componente_central/backend/Frontofficeciudadanos
      artifact-name: backend-frontofficeciudadanos
      artifact: ear/target/*.ear
      install-first: componente_central/backend/Frontofficefuncionarios
