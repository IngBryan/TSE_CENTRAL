name: Docker - WildFly

# WildFly contiene las 3 aplicaciones Jakarta EE del componente central.
# Se reconstruye cuando cambia alguna de ellas o la configuracion de la imagen.
on:
  push:
    branches:
      - main
    paths:
      - componente_central/backend/Frontofficeciudadanos/**
      - componente_central/backend/Frontofficefuncionarios/**
      - componente_central/backend/Backofficeautoridadesadministradores/**
      - wildfly/**
      - docker-compose.yml
      - .github/workflows/docker-wildfly.yml
      - .github/workflows/_docker-image.yml
  workflow_dispatch:

jobs:
  docker:
    uses: ./.github/workflows/_docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      service: wildfly