name: tse-central

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    container_name: rabbitmq-server
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"   # Panel web: http://localhost:15672
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    post_start:
      - user: rabbitmq
        command:
          - sh
          - -c
          - |
            for i in $$(seq 1 60); do rabbitmqctl -q await_startup >/dev/null 2>&1 && break; sleep 2; done
            rabbitmqctl import_definitions /etc/rabbitmq/definitions.json
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl -q list_queues name | grep -qx tracking.events"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  frontofficeciudadanos-front:
    hostname: frontofficeciudadanos
    container_name: frontciudadanos-server
    build:
      context: ./componente_central/frontend/frontofficeciudadanos
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
  frontofficefuncionarios-front:
    hostname: frontofficefuncionarios
    container_name: frontfuncionarios-server
    build:
      context: ./componente_central/frontend/Frontofficefuncionarios
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
  backofficeautoridadesadministradores-front:
    hostname: backofficeautoridadesadministradores
    container_name: backoffice-server
    build:
      context: ./componente_central/frontend/backofficeautoridadesadministradores
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # --- Backend (componente central) ---

  # Una unica base (main_db) compartida por los 3 proyectos. La imagen la crea a partir de
  # POSTGRES_DB, solo en el primer arranque (volumen vacio).
  postgres:
    image: postgres:17-alpine
    hostname: postgres
    container_name: postgres-server
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=main_db
    ports:
      # Puerto en la maquina configurable: si ya hay un PostgreSQL local en el 5432, usar otro
      # (POSTGRES_PORT en .env). WildFly no lo usa: se conecta por la red interna (postgres:5432).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Un unico WildFly con los 3 EAR desplegados (ciudadanos, funcionarios, backoffice).
  # Imagen: wildfly/Dockerfile. Los logs salen por consola (docker logs wildfly-server).
  wildfly:
    build:
      context: ./wildfly
      additional_contexts:
        backend: ./componente_central/backend
    hostname: wildfly
    container_name: wildfly-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_NAME=main_db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      # Consumo de la cola tracking.events (RabbitMQ de este mismo compose)
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      # PDI (TSE_NODOS): se alcanza por el puerto publicado en el host
      - PDI_URL=${PDI_URL:-http://host.docker.internal:3005/ws/servicioInformacion}
      - PDI_ORGANISMO_CODIGO=${PDI_ORGANISMO_CODIGO}
      - PDI_ORGANISMO_CLAVE=${PDI_ORGANISMO_CLAVE}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # necesario en Linux; en Docker Desktop ya existe
    ports:
      - "8080:8080"
    healthcheck:
      # Health check de la interfaz de administracion (solo accesible dentro del contenedor)
      test: ["CMD-SHELL", "curl -sf http://localhost:9990/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  rabbitmq-data:
  postgres-data: