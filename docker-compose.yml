name: tse-central

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    container_name: rabbitmq-server
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"   # Panel web: http://localhost:15672
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    post_start:
      - user: rabbitmq
        command:
          - sh
          - -c
          - |
            for i in $$(seq 1 60); do rabbitmqctl -q await_startup >/dev/null 2>&1 && break; sleep 2; done
            rabbitmqctl import_definitions /etc/rabbitmq/definitions.json
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl -q list_queues name | grep -qx tracking.events"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  frontofficeciudadanos-front:
    hostname: frontofficeciudadanos
    container_name: frontciudadanos-server
    build:
      context: ./componente_central/frontend/frontofficeciudadanos
    ports:
      - "3002:3000"
      # Login con gub.uy: la redirect URI registrada en ID Uruguay es http://localhost (puerto 80)
      - "80:3000"
    environment:
      - NODE_ENV=production
      - APP_BASE_URL=http://localhost
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      # Backend Frontofficeciudadanos (perfil + validacion PDI al ingresar)
      - BACKEND_URL=http://wildfly:8080/frontofficeciudadanos-web/api
      - BACKEND_API_KEY=${CIUDADANOS_API_KEY}
      # Firma el token (JWT HS256) de la app movil del chofer (TSE_MOVIL): /api/movil/*
      - MOVIL_TOKEN_SECRET=${MOVIL_TOKEN_SECRET}
    depends_on:
      - wildfly
    restart: unless-stopped
  frontofficefuncionarios-front:
    hostname: frontofficefuncionarios
    container_name: frontfuncionarios-server
    build:
      context: ./componente_central/frontend/Frontofficefuncionarios
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
      # Clave propia: si se filtra la de ciudadanos no sirve para fabricar sesiones de funcionarios
      - SESSION_SECRET=${FUNCIONARIOS_SESSION_SECRET}
      # Key propia del backend de funcionarios: la de ciudadanos no sirve para llamar a /casos
      - BACKEND_API_KEY=${FUNCIONARIOS_API_KEY}
      # Ingreso con cedula sin proveedor de identidad (hasta que se integre gub.uy)
      - LOGIN_TESTING=true
    volumes:
      # URLs de la app y del backend (ver src/lib/config.ts)
      - ./componente_central/frontend/Frontofficefuncionarios/config/docker.json:/app/config/app.json:ro
    depends_on:
      - wildfly
    restart: unless-stopped
  backofficeautoridadesadministradores-front:
    hostname: backofficeautoridadesadministradores
    container_name: backoffice-server
    build:
      context: ./componente_central/frontend/backofficeautoridadesadministradores
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # --- Backend (componente central) ---

  # Una unica base (main_db) compartida por los 3 proyectos. La imagen la crea a partir de
  # POSTGRES_DB, solo en el primer arranque (volumen vacio).
  postgres:
    image: postgres:17-alpine
    hostname: postgres
    container_name: postgres-server
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=main_db
    ports:
      # Puerto en la maquina configurable: si ya hay un PostgreSQL local en el 5432, usar otro
      # (POSTGRES_PORT en .env). WildFly no lo usa: se conecta por la red interna (postgres:5432).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # MongoDB (base main_db, coleccion tracking). El usuario root y la coleccion se crean solo en
  # el primer arranque (volumen vacio): MONGO_INITDB_* y los scripts de mongodb/init.
  mongodb:
    image: mongo:8.0.0
    hostname: mongodb
    container_name: mongodb-server
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=main_db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data/db
    healthcheck:
      # healthy recien cuando existe la coleccion (el ping solo no alcanza: responde durante el init)
      test: ["CMD-SHELL", "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin main_db --eval 'quit(db.getCollectionNames().includes(\"tracking\") ? 0 : 1)'"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Un unico WildFly con los 3 EAR desplegados (ciudadanos, funcionarios, backoffice).
  # Imagen: wildfly/Dockerfile. Los logs salen por consola (docker logs wildfly-server).
  wildfly:
    build:
      context: ./wildfly
      additional_contexts:
        backend: ./componente_central/backend
    hostname: wildfly
    container_name: wildfly-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_NAME=main_db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      # Consumo de la cola tracking.events (RabbitMQ de este mismo compose)
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      # PDI (TSE_NODOS): se alcanza por el puerto publicado en el host
      - PDI_URL=${PDI_URL:-http://host.docker.internal:3005/ws/servicioInformacion}
      - PDI_ORGANISMO_CODIGO=${PDI_ORGANISMO_CODIGO}
      - PDI_ORGANISMO_CLAVE=${PDI_ORGANISMO_CLAVE}
      # Claves que exigen las API REST (header X-Api-Key): una por frontoffice
      - CIUDADANOS_API_KEY=${CIUDADANOS_API_KEY}
      - FUNCIONARIOS_API_KEY=${FUNCIONARIOS_API_KEY}
      # Usuario de aplicacion para EJB remoto (lo crea wildfly/start.sh al arrancar)
      - EJB_USER=${EJB_USER}
      - EJB_PASSWORD=${EJB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # necesario en Linux; en Docker Desktop ya existe
    ports:
      - "8080:8080"
    healthcheck:
      # Health check de la interfaz de administracion (solo accesible dentro del contenedor)
      test: ["CMD-SHELL", "curl -sf http://localhost:9990/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Script de fiscalizacion automatica (jar standalone, no va en WildFly): consume tracking.events
  # y guarda los eventos en MongoDB. Imagen: componente_central/backend/Fiscalizacionautomatica/Dockerfile.
  fiscalizacionautomatica:
    build:
      context: ./componente_central/backend/Fiscalizacionautomatica
      # Modelo y Frontofficeciudadanos: de ahi sale el contrato del EJB remoto (ejb-client)
      additional_contexts:
        backend: ./componente_central/backend
    hostname: fiscalizacionautomatica
    container_name: fiscalizacion-server
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MONGO_HOST=mongodb
      - MONGO_DB=main_db
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      # EJB remoto de Frontofficeciudadanos (viajes en curso); mismo usuario que crea WildFly
      - WILDFLY_URL=remote+http://wildfly:8080
      - EJB_USER=${EJB_USER}
      - EJB_PASSWORD=${EJB_PASSWORD}

  # Misma imagen, en modo poller: consulta una vez la API de balanzas (TSE_NODOS) y termina.
  # No queda corriendo: lo lanza un cron con "docker compose run --rm fiscalizacionautomatica-poller".
  # El perfil "cron" evita que "docker compose up" lo arranque junto con el resto.
  fiscalizacionautomatica-poller:
    build:
      context: ./componente_central/backend/Fiscalizacionautomatica
      additional_contexts:
        backend: ./componente_central/backend
    profiles: ["cron"]
    command: ["weighings-poller"]
    # Las balanzas activas las pide por EJB remoto a WildFly (backoffice) y la ultima consulta
    # exitosa de cada una (balanzas_metadata) se guarda en MongoDB
    depends_on:
      mongodb:
        condition: service_healthy
      wildfly:
        condition: service_healthy
    environment:
      # En dev la URL de balanzas y el client id salen de estas variables; fuera de dev, de /app/config/app.json
      - ENVIRONMENT=dev
      - BALANZAS_URL=${BALANZAS_URL:-http://host.docker.internal:3001}
      - BALANZAS_CLIENT_ID=${BALANZAS_CLIENT_ID}
      - BALANZAS_CLIENT_SECRET=${BALANZAS_CLIENT_SECRET}
      - MONGO_HOST=mongodb
      - MONGO_DB=main_db
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - WILDFLY_URL=remote+http://wildfly:8080
      - EJB_USER=${EJB_USER}
      - EJB_PASSWORD=${EJB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # necesario en Linux; en Docker Desktop ya existe

volumes:
  rabbitmq-data:
  postgres-data:
  mongodb-data:
