apiVersion: v1
kind: ConfigMap
metadata:
  name: frontofficeciudadanos-front-config
  labels:
    app: frontofficeciudadanos-front
data:
  # URL publica del front (ingress + basePath /ciudadanos). De aca salen la redirect URI de gub.uy
  # (APP_BASE_URL) y la de logout (APP_BASE_URL/logout): las dos tienen que estar registradas en
  # ID Uruguay. https: el proxy de Elastic Cloud termina TLS delante del ingress (activa las cookies Secure).
  APP_BASE_URL: https://env-6537388.web.elasticloud.uy/ciudadanos
  OIDC_CLIENT_ID: "890192"
  # Service wildfly del namespace tse (puerto 80)
  BACKEND_URL: http://wildfly/frontofficeciudadanos-web/api
