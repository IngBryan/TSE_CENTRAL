apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontofficeciudadanos-front
  labels:
    app: frontofficeciudadanos-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontofficeciudadanos-front
  template:
    metadata:
      labels:
        app: frontofficeciudadanos-front
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: front
          image: ghcr.io/ingbryan/tse_central/frontofficeciudadanos-front:latest
          ports:
            - name: http
              containerPort: 3000
          # APP_BASE_URL, OIDC_CLIENT_ID y BACKEND_URL (configmap.yaml)
          envFrom:
            - configMapRef:
                name: frontofficeciudadanos-front-config
          # Secretos: tse-runtime-secrets (ver k8s/README.md). ciudadanos-api-key es la misma que usa WildFly (CIUDADANOS_API_KEY).
          env:
            - name: NODE_ENV
              value: production

            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: oidc-client-secret

            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: session-secret

            - name: BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: ciudadanos-api-key

            - name: MOVIL_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: movil-token-secret
          readinessProbe:
            httpGet:
              path: /ciudadanos/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ciudadanos/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
