apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontofficeciudadanos-front
  labels:
    app: frontofficeciudadanos-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontofficeciudadanos-front
  template:
    metadata:
      labels:
        app: frontofficeciudadanos-front
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: front
          image: ghcr.io/ingbryan/tse_central/frontofficeciudadanos-front:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /ciudadanos
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ciudadanos
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
