# Kustomize (y no manifiestos sueltos) porque Argo CD Image Updater solo puede cambiar el tag
# de la imagen en aplicaciones Kustomize o Helm.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tse

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# URLs de la app y del backend (ver src/lib/config.ts del front). El generador le agrega un hash al
# nombre: si cambia app.json, el Deployment se reinicia solo y toma la configuracion nueva.
configMapGenerator:
  - name: frontofficefuncionarios-front-config
    files:
      - app.json
