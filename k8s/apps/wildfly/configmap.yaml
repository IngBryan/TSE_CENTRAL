apiVersion: v1
kind: ConfigMap
metadata:
  name: wildfly-config
  labels:
    app: wildfly
data:
  # PDI (TSE_NODOS, servicio pdi). Ajustar segun donde se despliegue: Service pdi en el
  # namespace tse, o la URL publica de la PDI si corre fuera del cluster.
  PDI_URL: https://pdi-service-bryan-salamone-dev.apps.rm1.0a51.p1.openshiftapps.com/ws/servicioInformacion
  # Mismo valor que PDI_ORGANISMO_CODIGO de la PDI
  PDI_ORGANISMO_CODIGO: MTOP-CARGA
  # POST /api/ciudadanos/ingreso-testing (ingreso con cedula, sin gub.uy). Va junto con LOGIN_TESTING del
  # front de ciudadanos. Pasar a "false" cuando ID Uruguay registre la redirect URI de este ambiente.
  INGRESO_TESTING: "true"
