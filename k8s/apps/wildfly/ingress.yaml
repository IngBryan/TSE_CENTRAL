apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wildfly
  labels:
    app: wildfly
spec:
  ingressClassName: nginx

  rules:
    - host: env-6537388.web.elasticloud.uy
      http:
        paths:
          - path: /frontofficeciudadanos-web
            pathType: Prefix
            backend:
              service:
                name: wildfly
                port:
                  name: http

          - path: /frontofficefuncionarios-web
            pathType: Prefix
            backend:
              service:
                name: wildfly
                port:
                  name: http

          - path: /backofficeautoridadesadministradores-web
            pathType: Prefix
            backend:
              service:
                name: wildfly
                port:
                  name: http