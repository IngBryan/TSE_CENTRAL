apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildfly
  labels:
    app: wildfly
spec:
  replicas: 1

  selector:
    matchLabels:
      app: wildfly

  template:
    metadata:
      labels:
        app: wildfly

    spec:
      imagePullSecrets:
        - name: ghcr-credentials

      containers:
        - name: wildfly
          image: ghcr.io/ingbryan/tse_central/wildfly:latest

          ports:
            - name: http
              containerPort: 8080

          env:
            # PostgreSQL
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: main_db

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: postgres-user

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: postgres-password

            # RabbitMQ
            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: rabbitmq-user

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: rabbitmq-password

            # App movil del chofer: login con gub.uy (POST /api/movil/auth/token) y token de la app.
            # Sin estos valores el login de la app responde 503 ingreso_no_disponible.
            - name: OIDC_CLIENT_ID
              value: "890192"

            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: oidc-client-secret
                  optional: true

            - name: OIDC_REDIRECT_URIS_MOVIL
              value: "uy.carga.movil:/oauth2redirect,http://localhost:8080"

            - name: MOVIL_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: movil-token-secret
                  optional: true
            - name: BACKOFFICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: backoffice-jwt-secret
                  optional: true

            # X-Api-Key de frontofficeciudadanos-web (la misma que BACKEND_API_KEY del front de ciudadanos)
            - name: CIUDADANOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: ciudadanos-api-key
                  optional: true

            # X-Api-Key de frontofficefuncionarios-web (la misma que BACKEND_API_KEY del front de funcionarios)
            - name: FUNCIONARIOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: funcionarios-api-key
                  optional: true

            # Usuario de aplicacion para EJB remoto (lo crea start.sh al arrancar).
            # optional: sin las claves en el Secret, WildFly arranca igual pero sin el usuario.
            - name: EJB_USER
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: ejb-user
                  optional: true

            - name: EJB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: ejb-password
                  optional: true

            # PDI: PDI_URL y PDI_ORGANISMO_CODIGO salen de configmap.yaml (envFrom)
            - name: PDI_ORGANISMO_CLAVE
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: pdi-organismo-clave

            # Replaces the "-Xms64m -Xmx512m" default of standalone.conf. Leaves ~800Mi of the limit for
            # metaspace, threads and buffers.
            - name: JBOSS_JAVA_SIZING
              value: "-Xms256m -Xmx1200m"

          envFrom:
            - configMapRef:
                name: wildfly-config

          # WildFly puede tardar bastante en desplegar los 3 EAR.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sf http://127.0.0.1:9990/health/ready >/dev/null
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sf http://127.0.0.1:9990/health/ready >/dev/null
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 2Gi

          securityContext:
            runAsNonRoot: true
            # jboss user of the WildFly base image (non-numeric USER in the Dockerfile)
            runAsUser: 1000
            allowPrivilegeEscalation: false