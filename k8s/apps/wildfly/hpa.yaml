# Scales WildFly by CPU. Possible because it keeps no state of its own: the backoffice authenticates with a
# signed token instead of a session, and the timers (PDI revalidation, descargo expiry) take a PostgreSQL lock
# so one replica runs each at a time. Requires metrics-server in the cluster (kubectl top pods must answer).
#
# - Minimum 2: WildFly takes minutes to deploy the 3 EARs, so a replica started when a peak arrives comes too
#   late. Besides, fiscalizacion calls WildFly over persistent EJB connections (remote+http) that don't move
#   to a new replica: with 2 from the start its pods spread over both when they connect.
# - Maximum 3: each replica takes 1-2 GiB and opens its own pool of up to 20 PostgreSQL connections.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wildfly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wildfly
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
