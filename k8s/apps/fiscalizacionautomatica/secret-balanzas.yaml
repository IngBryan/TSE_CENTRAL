# Client secret del nodo de balanzas para el poller (CronJob); la URL y el client id estan en app.json
# (ConfigMap). La clave queda definida pero vacia: el valor de produccion se carga a mano (ver k8s/README.md). Argo CD lo crea una vez y despues no pisa los valores
# (ignoreDifferences sobre /data en k8s/argocd/fiscalizacionautomatica.yaml) ni lo borra (Prune=false).
apiVersion: v1
kind: Secret
metadata:
  name: fiscalizacion-balanzas
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  BALANZAS_CLIENT_SECRET: ""
