apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiscalizacionautomatica
  labels:
    app: fiscalizacionautomatica
spec:
  # Sin replicas: las maneja KEDA segun los mensajes en la cola tracking.events (keda.yaml)
  selector:
    matchLabels:
      app: fiscalizacionautomatica

  template:
    metadata:
      labels:
        app: fiscalizacionautomatica

    spec:
      imagePullSecrets:
        - name: ghcr-credentials

      containers:
        - name: fiscalizacionautomatica
          image: ghcr.io/ingbryan/tse_central/fiscalizacionautomatica:latest

          env:
            - name: ENVIRONMENT
              value: "prod"

            # RabbitMQ
            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: RABBITMQ_PORT
              value: "5671"

            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: rabbitmq-user

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: rabbitmq-password

            # MongoDB
            - name: MONGO_HOST
              value: mongodb

            - name: MONGO_PORT
              value: "27017"

            - name: MONGO_DB
              value: main_db

            - name: MONGO_AUTH_DB
              value: admin

            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: mongo-user

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: mongo-password

            # EJB remotos en WildFly (GPS activos, viajes en curso); mismo usuario que crea WildFly.
            # Obligatorios: sin la lista de GPS activos el consumidor no arranca.
            - name: WILDFLY_URL
              value: remote+http://wildfly:8080

            - name: EJB_USER
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: ejb-user

            - name: EJB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tse-runtime-secrets
                  key: ejb-password

            # OpenTelemetry: consumo de tracking.events (amqp-client) y Mongo, instrumentados solo.
            # Las llamadas a EJB remoto en WildFly no propagan contexto (sin modulo de instrumentacion
            # para jboss-ejb-client), asi que ese salto queda como traza aparte en WildFly.
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/otel-javaagent.jar"

            - name: OTEL_SERVICE_NAME
              value: "fiscalizacionautomatica"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-cloud-otel-receiver.grafana-cloud.svc.cluster.local:4317"

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"

            - name: OTEL_TRACES_EXPORTER
              value: "otlp"

            - name: OTEL_METRICS_EXPORTER
              value: "none"

            - name: OTEL_LOGS_EXPORTER
              value: "none"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false