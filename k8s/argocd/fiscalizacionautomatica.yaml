apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fiscalizacionautomatica
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/IngBryan/TSE_CENTRAL.git
    targetRevision: main
    path: k8s/apps/fiscalizacionautomatica

  destination:
    server: https://kubernetes.default.svc
    namespace: tse

  # Los valores del Secret fiscalizacion-balanzas se cargan a mano en produccion: Argo CD lo crea con las
  # claves vacias y despues no lo vuelve a sincronizar (si no, el selfHeal los dejaria vacios otra vez)
  ignoreDifferences:
    - kind: Secret
      name: fiscalizacion-balanzas
      jsonPointers:
        - /data
        - /stringData

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: fiscalizacionautomatica
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd

  applicationRefs:
    - namePattern: "fiscalizacionautomatica"
      images:
        - alias: fiscalizacionautomatica
          imageName: ghcr.io/ingbryan/tse_central/fiscalizacionautomatica
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^sha-[0-9a-f]{7}$"
            pullSecret: pullsecret:argocd/ghcr-credentials