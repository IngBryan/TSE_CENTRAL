# Application: Argo CD mantiene el cluster igual a k8s/apps/frontofficefuncionarios-front en main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontofficefuncionarios-front
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/IngBryan/TSE_CENTRAL.git
    targetRevision: main
    path: k8s/apps/frontofficefuncionarios-front
  destination:
    server: https://kubernetes.default.svc
    namespace: tse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# ImageUpdater: cada 2 minutos revisa ghcr.io y, si el CI publico una imagen nueva
# (tag sha-<commit>), actualiza solo esta app.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: frontofficefuncionarios-front
  namespace: argocd
spec:
  # argocd: guarda el tag nuevo en la Application, sin hacer commits en el repo
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: "frontofficefuncionarios-front"
      images:
        - alias: front
          imageName: ghcr.io/ingbryan/tse_central/frontofficefuncionarios-front
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^sha-[0-9a-f]{7}$"
            pullSecret: pullsecret:argocd/ghcr-credentials
