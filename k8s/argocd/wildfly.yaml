apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wildfly
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/IngBryan/TSE_CENTRAL.git
    targetRevision: main
    path: k8s/apps/wildfly

  destination:
    server: https://kubernetes.default.svc
    namespace: tse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: wildfly
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd

  applicationRefs:
    - namePattern: "wildfly"
      images:
        - alias: wildfly
          imageName: ghcr.io/ingbryan/tse_central/wildfly
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^sha-[0-9a-f]{7}$"
            pullSecret: pullsecret:argocd/ghcr-credentials