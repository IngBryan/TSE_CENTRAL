apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tse-infrastructure
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/IngBryan/TSE_CENTRAL.git
    targetRevision: main
    path: k8s/infrastructure

  destination:
    server: https://kubernetes.default.svc
    namespace: tse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true